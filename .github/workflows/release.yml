name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: tet-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun test
      - run: bun run release:prepare
      - name: Verify the package with the pinned Magpie host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/yetone/magpie/contents/internal/plugin/host.js?ref=3cabaab54fa2d6c77bbc491942d2ada9e2535577 \
            -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/magpie-host.js"
          bun run test:host "$RUNNER_TEMP/magpie-host.js"
          bun run check:package "$RUNNER_TEMP/magpie-host.js"
      - name: Publish the GitHub Release with its build archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="TET-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" --json targetCommitish,isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e --arg commit "$GITHUB_SHA" \
              '.targetCommitish == $commit and .isDraft == false' "$RUNNER_TEMP/release.json"
            gh release download "$GITHUB_REF_NAME" --pattern "$archive" --dir "$RUNNER_TEMP/release-check"
            cmp ".release/$archive" "$RUNNER_TEMP/release-check/$archive"
          else
            gh release create "$GITHUB_REF_NAME" ".release/$archive" \
              --verify-tag --target "$GITHUB_SHA" --title "TET $GITHUB_REF_NAME" \
              --notes-file .release/notes.md --latest
          fi
